<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Git Lane horizontal graph</title>
  <desc id="desc">Actual Git Lane horizontal graph screen captured from this repository.</desc>
  <style>.bg{fill:#0d1117}.bar{fill:#161b22}.border{fill:none;stroke:#d0d7de;stroke-width:2}.t{font:20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d0d7de}.b{font-weight:700}.dim{fill:#8b949e}.cyan{fill:#39c5cf}.yellow{fill:#f2cc60}.green{fill:#7ee787}</style>
  <rect width="1200" height="720" fill="#eef2f7"/><rect x="70" y="50" width="1060" height="620" rx="16" class="bg"/><rect x="70" y="50" width="1060" height="48" rx="16" class="bar"/><circle cx="104" cy="74" r="9" fill="#ff5f57"/><circle cx="134" cy="74" r="9" fill="#ffbd2e"/><circle cx="164" cy="74" r="9" fill="#28c840"/>
  <g class="t" transform="translate(104 132)">
    <rect x="0" y="-24" width="992" height="64" rx="8" class="border"/><text y="16"><tspan class="b">Git Lane</tspan><tspan dx="430" class="cyan">FOCUSED</tspan><tspan dx="20" class="dim">origin OFF</tspan><tspan dx="20" class="cyan">view H</tspan><tspan dx="20" class="dim">refs </tspan><tspan class="green">main</tspan></text>
    <text y="78"><tspan class="dim">newer ← commits → older</tspan><tspan dx="250">╭──────────────────────────────╮</tspan></text>
    <text y="114"><tspan class="green b">main</tspan><tspan dx="48" class="yellow b">◉─</tspan><tspan class="cyan">─────────────────────────────</tspan><tspan dx="72">│ </tspan><tspan class="b">docs: expand screenshot gal…</tspan><tspan> │</tspan></text>
    <text y="150"><tspan class="green b">[main]</tspan><tspan dx="8" class="b">a44c061 docs: expand screenshot gallery</tspan><tspan dx="34">│ </tspan><tspan class="dim">commit </tspan><tspan>a44c061b26b141fc6b09… │</tspan></text>
    <text y="186"><tspan dx="642">│ </tspan><tspan class="dim">author </tspan><tspan>dennis                │</tspan></text>
    <text y="222"><tspan dx="642">│ </tspan><tspan class="dim">refs   </tspan><tspan>HEAD -&gt; main          │</tspan></text>
    <text y="258"><tspan dx="642">│ </tspan><tspan class="dim">parents</tspan><tspan>82a5eae0c2d017600e6f… │</tspan></text>
    <text y="294"><tspan dx="642">╰──────────────────────────────╯</tspan></text>
    <rect x="0" y="360" width="992" height="64" rx="8" class="border"/><text y="400" class="dim">↑↓/←→/jk move · Enter details · b branches · f focused/full · h view · o origin · r refresh · q quit</text>
  </g>
</svg>
