<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Git Lane origin branch view</title>
  <desc id="desc">Git Lane showing local and origin refs together in the focused graph.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <style>
      .term { font: 24px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .small { font-size: 20px; }
      .bold { font-weight: 700; }
      .dim { fill: #8b949e; }
      .fg { fill: #d0d7de; }
      .yellow { fill: #f2cc60; }
      .green { fill: #7ee787; }
      .cyan { fill: #39c5cf; }
      .magenta { fill: #d2a8ff; }
      .border { fill: none; stroke: #d0d7de; stroke-width: 2; opacity: 0.9; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#eef2f7"/>
  <g filter="url(#shadow)">
    <rect x="70" y="58" width="1060" height="604" rx="18" fill="#0d1117"/>
    <rect x="70" y="58" width="1060" height="50" rx="18" fill="#161b22"/>
    <circle cx="104" cy="83" r="9" fill="#ff5f57"/>
    <circle cx="133" cy="83" r="9" fill="#ffbd2e"/>
    <circle cx="162" cy="83" r="9" fill="#28c840"/>
    <rect x="70" y="96" width="1060" height="566" fill="#0d1117"/>

    <g class="term" transform="translate(104 140)">
      <rect class="border" x="0" y="-26" width="992" height="76" rx="10"/>
      <text y="20"><tspan class="fg bold">Git Lane</tspan><tspan dx="390" class="cyan">FOCUSED</tspan><tspan dx="20" class="cyan">origin ON</tspan><tspan dx="20" class="dim">view V</tspan><tspan dx="20" class="dim">refs </tspan><tspan class="green">main, origin/main</tspan></text>

      <text y="82"><tspan class="dim">selected lanes</tspan><tspan dx="24" class="cyan">◆ ref 1: main</tspan><tspan dx="24" class="magenta">◆ ref 2: origin/main</tspan></text>
      <text y="132"><tspan class="yellow">› </tspan><tspan class="yellow bold">◆ ◆</tspan><tspan dx="26" class="yellow bold">215028c</tspan><tspan dx="18" class="green bold">[main]</tspan><tspan dx="12" class="cyan">(origin/main)</tspan><tspan dx="14" class="fg bold">Bump version to 1.0.5</tspan></text>
      <text y="174"><tspan dx="42" class="cyan">│</tspan><tspan dx="24" class="magenta">│</tspan><tspan dx="38" class="yellow">3568892</tspan><tspan dx="18" class="fg">Show uncommitted changes in graph</tspan></text>
      <text y="216"><tspan dx="42" class="cyan">│</tspan><tspan dx="24" class="magenta">│</tspan><tspan dx="38" class="yellow">3524d92</tspan><tspan dx="18" class="fg">Release 1.0.4</tspan></text>
      <text y="258"><tspan dx="42" class="cyan">│</tspan><tspan dx="24" class="magenta">│</tspan><tspan dx="38" class="yellow">4782ed6</tspan><tspan dx="18" class="fg">Release 0.1.3</tspan></text>
      <text y="300"><tspan dx="42" class="cyan">│</tspan><tspan dx="24" class="magenta">│</tspan><tspan dx="38" class="yellow">4748a16</tspan><tspan dx="18" class="fg">Use selected ref lanes in vertical view</tspan></text>
      <text y="342"><tspan dx="42" class="cyan">│</tspan><tspan dx="24" class="magenta">│</tspan><tspan dx="38" class="yellow">eddea1e</tspan><tspan dx="18" class="fg">Fix horizontal branch lane fallback</tspan></text>
      <text y="384"><tspan dx="42" class="cyan">│</tspan><tspan dx="24" class="magenta">│</tspan><tspan dx="38" class="yellow">b92c74a</tspan><tspan dx="18" class="fg">Separate selected ref display lanes</tspan></text>

      <rect class="border" x="0" y="462" width="992" height="76" rx="10"/>
      <text y="510" class="dim small">↑↓/←→/jk move · Enter details · b branches · f focused/full · h view · o origin · q quit</text>
    </g>
  </g>
</svg>
